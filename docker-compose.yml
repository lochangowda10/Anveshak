services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anveshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anveshak}
      POSTGRES_DB: ${POSTGRES_DB:-anveshak}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anveshak -d anveshak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - anveshak-net

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anveshak}:${POSTGRES_PASSWORD:-anveshak}@postgres:5432/${POSTGRES_DB:-anveshak}
      TRONGRID_API_KEY: ${TRONGRID_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anveshak-net

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - anveshak-net

volumes:
  pgdata:

networks:
  anveshak-net:
    driver: bridge
