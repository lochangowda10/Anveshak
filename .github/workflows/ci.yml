name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anveshak
          POSTGRES_PASSWORD: anveshak
          POSTGRES_DB: anveshak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anveshak -d anveshak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://anveshak:anveshak@localhost:5432/anveshak
      TEST_DATABASE_URL: postgresql+asyncpg://anveshak:anveshak@localhost:5432/anveshak_test
      TRONGRID_API_KEY: test-key
      SECRET_KEY: test-secret-key-for-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: alembic upgrade head
      - run: pytest tests/ -v --cov=app --cov-fail-under=80

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm run test --run
      - run: pnpm build
